name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONIOENCODING: utf-8

jobs:

  # ── Stage 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: "Stage 1 · Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyflakes
      - name: Lint all Python files
        run: |
          python -m pyflakes main.py models.py validators.py engine.py \
            outputs.py compare.py batch.py
          python -m pyflakes checks/
          python -m pyflakes export/
          python -m pyflakes bearing_types/
          python -m pyflakes tests/
          python -m pyflakes web/app.py
          python -m pyflakes scripts/

  # ── Stage 2: Tests across 4 Python versions ───────────────────────────────
  test:
    name: "Stage 2 · Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v --tb=short

  # ── Stage 3: Verify sample input matches brief / spreadsheet ──────────────
  verify:
    name: "Stage 3 · Verification (sample input)"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Verify sample (verbose output + JSON assertions)
        run: python scripts/verify_sample.py

  # ── Stage 4: Features smoke test ──────────────────────────────────────────
  features:
    name: "Stage 4 · Features smoke test"
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: CLI features, exports, bad-input handling
        run: python scripts/smoke_features.py
